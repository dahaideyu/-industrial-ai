[project]
name = "chaowei-agent"
version = "2.0.0"
description = "工业设备智能监控与分析平台（含 NL2SQL 智能问答）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.6",
    "websockets>=13.0",
    # 数据库
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.0",
    # 认证
    "passlib>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt<4.1",
    # AI / LLM
    "openai>=1.50.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    # SQL-QA 专用
    "vanna>=2.0.0rc1",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "neo4j>=5.20.0",
    "sqlglot>=23.0.0",
    # 数据处理
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "openpyxl>=3.0.0",
    "scikit-learn>=1.3.0",
    # 工具
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "cryptography>=43.0.0",
    "python-dateutil>=2.8.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # 知识库管理模块
    "celery>=5.4",
    "minio>=7.2",
    "pymupdf>=1.24",
    # PLC 解析服务
    "pillow>=10.0",
    "redis>=8.0.0",
    "markitdown[all]>=0.1.5",
    "rapidocr-onnxruntime>=1.4",
    "opencv-python>=4.8",
    # MQTT ETL 服务
    "paho-mqtt>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv.sources]
# vanna v2 from GitHub (if accessible):
# vanna = { git = "https://github.com/vanna-ai/vanna.git", rev = "v2" }

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
