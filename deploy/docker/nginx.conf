# Industrial Intelligence - Nginx 配置示例
# 使用方法：
#   1. 修改 server_name 和路径
#   2. 复制到 /etc/nginx/sites-available/aiReport
#   3. 创建软链接：ln -s /etc/nginx/sites-available/aiReport /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx

# .mjs 补充 MIME（放 server 外=http 级，与主配置 mime.types 合并；若放进 server 级
# 会整表替换、其余类型全变 octet-stream。缺它时 .mjs 被按 octet-stream 返回，
# 浏览器 ES Module 动态 import 拒绝执行，pdf.js worker 加载失败）
types {
    application/javascript mjs;
}

server {
    listen 80;
    server_name _;  # 替换为你的域名或服务器 IP

    # 上传体积上限（nginx 默认 1m，知识库传 PDF/Word 会直接 413）
    client_max_body_size 500m;

    # 前端静态资源（Vite 构建产物）
    location / {
        root /app/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 维修建议/工单评分 → 独立微服务容器 repair-suggestion:8000（compose 服务名 DNS）。
    # 正则 location 优先级高于下面的 /api/ 前缀匹配，只劫走这 4 个路径。
    # 用 resolver+变量延迟解析：repair-suggestion 容器没起时 nginx 照常启动，请求时才 502。
    # 裸机部署（非 compose）时把 $repair_upstream 改成 http://127.0.0.1:8000 并删掉 resolver 行。
    location ~ ^/api/(repair-suggestion|repair-order-scoring|task-suggestion|task-scoring)$ {
        resolver 127.0.0.11 valid=30s;
        set $repair_upstream http://repair-suggestion:8000;
        proxy_pass $repair_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM 生成较慢，保持与 /api/ 一致的长超时
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API 代理到后端 FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:9300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE 流式响应必需
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
