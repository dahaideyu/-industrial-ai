# 生产环境覆盖配置
# 用法: docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/docker-compose.prod.yml up -d

services:
  industrial-ai:
    container_name: industrial-ai-prod
    env_file:
      - ./.env.prod
    ports:
      - "9300:80"

  knb-celery-worker:
    env_file:
      - ./.env.prod

  mqtt-etl:
    env_file:
      - ./.env.prod
