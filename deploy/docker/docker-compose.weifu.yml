# 伟复环境覆盖配置
# 用法: docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/docker-compose.weifu.yml --profile local-db up -d

services:
  industrial-ai:
    container_name: industrial-ai-weifu
    env_file:
      - ./.env.prod.weifu
    ports:
      - "9300:80"

  # 伟复环境启用内部 PostgreSQL（通过 --profile local-db 激活）
  postgresql:
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: zxzz
      POSTGRES_PASSWORD: CHANGE_ME@Zxzz

  knb-celery-worker:
    env_file:
      - ./.env.prod.weifu

  repair-suggestion:
    env_file:
      - ./.env.prod.weifu

  mqtt-etl:
    env_file:
      - ./.env.prod.weifu

  # Redis 端口覆盖（避免与服务器上已有的 redis 冲突）
  redis:
    container_name: redis-weifu
    ports:
      - "16379:6379"

  # MinIO 端口覆盖（避免与服务器上已有的 minio 冲突）
  minio:
    container_name: minio-weifu
    ports: !override
      - "9002:9000"
      - "9003:9001"
