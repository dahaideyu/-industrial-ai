name: Deploy dev to Tencent Cloud

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: industrial-ai-dev-deploy
  # Do not interrupt a deployment halfway through. A newer push waits for the
  # current deployment and then replaces it.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/dahaideyu/industrial-ai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: final-app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:dev
          # provenance/sbom 关掉：默认会额外生成证明制品，把镜像变成多 manifest 索引，
          # push 和 pull 都要多传一轮。这条流水线不做供应链签名校验，纯属开销。
          provenance: false
          sbom: false
          # APT_MIRROR= （空）：构建跑在境外 runner 上，走国内镜像源反而更慢，
          # 用官方 deb.debian.org。服务器本地构建时不传此参数，走 Dockerfile 里的清华源默认值。
          build-args: |
            COMPILE_SOURCE=false
            VITE_ENABLE_SQL_QA=true
            APT_MIRROR=
          # cache-from 读三个 scope：app/worker/lean 共享 backend-deps、code-protect、
          # final-base、final-office 这几层，跨 scope 读取可以让冷启动时也复用，
          # 不必每个 scope 各自重建一遍公共阶段。cache-to 仍写各自 scope，避免互相覆盖。
          cache-from: |
            type=gha,scope=industrial-ai-app
            type=gha,scope=industrial-ai-worker
            type=gha,scope=industrial-ai-lean
          cache-to: type=gha,mode=max,scope=industrial-ai-app

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: final-worker
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-worker:${{ github.sha }}
            ${{ env.IMAGE_NAME }}-worker:dev
          provenance: false
          sbom: false
          build-args: |
            COMPILE_SOURCE=false
            APT_MIRROR=
          cache-from: |
            type=gha,scope=industrial-ai-app
            type=gha,scope=industrial-ai-worker
            type=gha,scope=industrial-ai-lean
          cache-to: type=gha,mode=max,scope=industrial-ai-worker

      - name: Build and push lean image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: final-base
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-lean:${{ github.sha }}
            ${{ env.IMAGE_NAME }}-lean:dev
          provenance: false
          sbom: false
          build-args: |
            COMPILE_SOURCE=false
            APT_MIRROR=
          cache-from: |
            type=gha,scope=industrial-ai-app
            type=gha,scope=industrial-ai-worker
            type=gha,scope=industrial-ai-lean
          cache-to: type=gha,mode=max,scope=industrial-ai-lean

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 15 分钟不够：服务器在国内，要从 ghcr.io 拉三个应用镜像（final-app 带
    # LibreOffice+nginx+前端，体积不小）外加 timescaledb/postgres/redis/minio 几个
    # 基础镜像，跨境拉几个 GB 经常超过 15 分钟，超时后 GitHub 会取消 job，
    # 步骤日志里显示的就是 "Error: The operation was canceled"。
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync source
        shell: bash
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'deploy/docker/.env' \
            -e "ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -p ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/id_ed25519" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/industrial-ai/"

      # 应用镜像走 ghcr.io，但 timescaledb/postgres/redis/minio 这几个基础镜像仍从
      # Docker Hub 拉，国内直连又慢又限流。mirror.ccs.tencentyun.com 是腾讯云给 CVM 的
      # 内网加速，免费且不占 Docker Hub 匿名限额。必须配在服务器上——真正执行 pull 的是
      # 腾讯云那台机器，配在 runner 上没有任何作用。
      # 幂等：已生效则跳过；已有 daemon.json 但没配 mirror 时只告警不自动改，避免覆盖
      # 别的配置项。continue-on-error：部署账号未必有免密 sudo，失败不该阻断部署。
      - name: Ensure Docker registry mirror
        continue-on-error: true
        shell: bash
        run: |
          ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -p "${{ secrets.DEPLOY_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -se' <<'REMOTE'
          set -Euo pipefail
          if docker info 2>/dev/null | grep -q "mirror.ccs.tencentyun.com"; then
            echo "registry mirror 已生效，跳过"
            exit 0
          fi
          if [ -s /etc/docker/daemon.json ]; then
            echo "::warning::/etc/docker/daemon.json 已存在但未配 registry-mirrors，跳过自动修改，请手动合并"
            cat /etc/docker/daemon.json
            exit 0
          fi
          echo "=== 写入 registry mirror 并重启 docker ==="
          sudo install -d -m 755 /etc/docker
          echo '{ "registry-mirrors": ["https://mirror.ccs.tencentyun.com"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl daemon-reload
          sudo systemctl restart docker
          for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info | grep -A3 "Registry Mirrors" || true
          REMOTE

      - name: Pull images and restart
        shell: bash
        run: |
          ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -p "${{ secrets.DEPLOY_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/industrial-ai
          install -d -m 700 /data/industrial-ai/config
          if [ ! -f /data/industrial-ai/config/.env ]; then
            cp deploy/docker/.env.example /data/industrial-ai/config/.env
            chmod 600 /data/industrial-ai/config/.env
          fi
          ln -sfn /data/industrial-ai/config/.env deploy/docker/.env
          docker volume inspect industrial_pgdata >/dev/null 2>&1 || docker volume create industrial_pgdata
          docker volume inspect industrial_minio >/dev/null 2>&1 || docker volume create industrial_minio
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | \
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          export IMAGE_NAME='${{ env.IMAGE_NAME }}'
          export IMAGE_TAG='${{ github.sha }}'
          export APP_DATA_ROOT=/data/industrial-ai
          export APP_PORT=9300
          # 跨境拉几个 GB 很容易中途断。docker 的分层缓存让重试能接着上次的进度走，
          # 所以循环重试比一次失败就判死刑划算得多。
          for attempt in 1 2 3; do
            echo "=== docker compose pull (第 $attempt/3 次) ==="
            if docker compose \
                 -f deploy/docker/docker-compose.yml \
                 -f deploy/docker/docker-compose.tencent.yml \
                 --profile local-db \
                 pull; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "拉取三次均失败，中止部署"
              exit 1
            fi
            sleep 15
          done
          docker compose \
              -f deploy/docker/docker-compose.yml \
              -f deploy/docker/docker-compose.tencent.yml \
              --profile local-db \
              up -d --no-build --remove-orphans
          curl --fail --retry 20 --retry-delay 3 http://127.0.0.1:9300/
          REMOTE
