name: Deploy dev to Tencent Cloud

# 架构：只同步代码，镜像在腾讯云服务器上本地构建。
# 不经过任何 registry 分发应用镜像——ghcr.io 从国内拉取跨境几个 GB，是之前
# deploy 超时被取消的根因；腾讯云 TCR 收费。改为服务器本地构建后，对外依赖只剩
# Docker Hub 的几个基础镜像（已由 registry mirror 走腾讯云内网加速）和
# apt/pypi/npm（Dockerfile 里已全部指向国内源）。

on:
  push:
    branches:
      - dev
  workflow_dispatch:

# cancel-in-progress: false —— 部署是有状态操作，跑到一半被新 push 腰斩会在服务器上
# 留下写了一半的镜像层和孤儿 build 进程（2026-07-29 那次 31 分钟的构建就是这么没的，
# 报错 "Error: The operation was canceled"）。改成排队后同一时刻仍只跑一个，
# 但新的会等旧的跑完，不会互相打断。
concurrency:
  group: industrial-ai-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 服务器本地构建 + 首次冷缓存可能接近半小时，留足余量。
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # 只同步代码，几 MB 文本，跨境传输不构成瓶颈。
      # 排除 deploy/docker/.env —— 服务器上那是指向 /data/.../config/.env 的软链，
      # 覆盖会把权威配置弄丢。
      - name: Sync source
        shell: bash
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'deploy/docker/.env' \
            -e "ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -p ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/id_ed25519" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/industrial-ai/"

      # 服务器直连 Docker Hub 又慢又限流。mirror.ccs.tencentyun.com 是腾讯云给 CVM 的
      # 内网加速：走内网、免费、不占 Docker Hub 匿名拉取限额。必须配在服务器上——
      # 真正执行 docker pull 的是腾讯云那台机器，配在 runner 上没有任何作用。
      # 幂等：已生效则跳过；已有 daemon.json 但没配 mirror 时只告警不自动改，避免覆盖
      # 别的配置项（比如 tencent.yml 注释里提到的 data-root）。
      # continue-on-error：部署账号未必有免密 sudo，失败不该阻断部署。
      - name: Ensure Docker registry mirror
        continue-on-error: true
        shell: bash
        run: |
          ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -p "${{ secrets.DEPLOY_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -se' <<'REMOTE'
          set -Euo pipefail
          if docker info 2>/dev/null | grep -q "mirror.ccs.tencentyun.com"; then
            echo "registry mirror 已生效，跳过"
            exit 0
          fi
          if [ -s /etc/docker/daemon.json ]; then
            echo "::warning::/etc/docker/daemon.json 已存在但未配 registry-mirrors，跳过自动修改，请手动合并"
            cat /etc/docker/daemon.json
            exit 0
          fi
          echo "=== 写入 registry mirror 并重启 docker ==="
          sudo install -d -m 755 /etc/docker
          echo '{ "registry-mirrors": ["https://mirror.ccs.tencentyun.com"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl daemon-reload
          sudo systemctl restart docker
          for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info | grep -A3 "Registry Mirrors" || true
          REMOTE

      # 把基础镜像拉取从 build 里拆出来单独做，带重试和单次超时。
      # 好处：1) Docker Hub 偶发超时不会直接判整个部署失败；2) 日志里一眼能分清
      # 是"拉取慢"还是"构建慢"；3) 已存在的镜像直接跳过。
      # continue-on-error：这里拉不到还有 build 阶段兜底，不该提前阻断。
      - name: Pre-pull base images
        continue-on-error: true
        shell: bash
        run: |
          ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -p "${{ secrets.DEPLOY_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -se' <<'REMOTE'
          set -Euo pipefail
          IMAGES="node:22-alpine python:3.12-slim timescale/timescaledb:2.19.1-pg14 postgres:15 redis:7-alpine minio/minio"
          for img in $IMAGES; do
            if docker image inspect "$img" >/dev/null 2>&1; then
              echo "已存在，跳过: $img"
              continue
            fi
            for attempt in 1 2 3; do
              echo "=== 拉取 $img (第 $attempt/3 次) ==="
              if timeout 600 docker pull "$img"; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::warning::预拉取失败，留给 build 阶段重试: $img"
              fi
              sleep 10
            done
          done
          REMOTE

      - name: Build and restart
        shell: bash
        run: |
          ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -p "${{ secrets.DEPLOY_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/industrial-ai
          install -d -m 700 /data/industrial-ai/config
          if [ ! -f /data/industrial-ai/config/.env ]; then
            cp deploy/docker/.env.example /data/industrial-ai/config/.env
            chmod 600 /data/industrial-ai/config/.env
          fi
          ln -sfn /data/industrial-ai/config/.env deploy/docker/.env
          docker volume inspect industrial_pgdata >/dev/null 2>&1 || docker volume create industrial_pgdata
          docker volume inspect industrial_minio >/dev/null 2>&1 || docker volume create industrial_minio
          # COMPILE_SOURCE=false：dev 环境不做 Cython 编译。Dockerfile 的设计意图本就是
          # "测试环境不编译（构建快、方便调试），生产环境编译（保护源码）"。关掉后连带
          # 省去 gcc/python3-dev/build-essential 的安装，以及每次改后端代码都要重跑的全量编译。
          # 不传 APT_MIRROR：走 Dockerfile 里的清华源默认值（服务器在国内，这是对的）。
          APP_DATA_ROOT=/data/industrial-ai APP_PORT=9300 COMPILE_SOURCE=false \
            docker compose \
              -f deploy/docker/docker-compose.yml \
              -f deploy/docker/docker-compose.tencent.yml \
              --profile local-db \
              up -d --build --remove-orphans
          curl --fail --retry 20 --retry-delay 3 http://127.0.0.1:9300/
          REMOTE

      # 反复构建会积累无 tag 的悬空层，磁盘满了会让后续构建以各种莫名其妙的方式失败。
      # 只清 dangling，绝不用 system prune -a —— 那会把 python:3.12-slim、node:22-alpine
      # 这些基础镜像缓存一起清掉，下次又要从头拉一遍。
      - name: Prune dangling images
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
            -p "${{ secrets.DEPLOY_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -se' <<'REMOTE'
          set -Euo pipefail
          docker image prune -f
          echo "=== 磁盘占用 ==="
          df -h / /data 2>/dev/null || df -h /
          REMOTE
