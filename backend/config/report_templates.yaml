      - template: "quality_monthly_report02.txt"
        output_name: "趋势分析"
        use_raw_data: false
        use_ragflow: false
        context_from_index: 0
        use_historical_context: true

      - template: "quality_monthly_report03.txt"
        output_name: "改善建议"
        use_raw_data: false
        use_ragflow: true
        context_from_index: 1

  # ========================================
  # 设备效率报告（动态映射）
  # 根据 periodType 和 workshopId 动态选择模板
  # periodType: day/week/month
  # workshopId: 有值=车间级，无值/null=工厂级
  # ========================================
  deviceEfficiencyReport:
    name: "设备效率报告"
    dynamic: true
    # 条件映射规则
    conditions:
      # 根据 periodType 选择周期
      - field: "periodType"
        mapping:
          day:
            # 根据 workshopId 选择维度
            conditions:
              - field: "workshopId"
                mapping:
                  null: "deviceEfficiencyFactoryDailyReport"
                  default: "deviceEfficiencyWorkshopDailyReport"
          week:
            conditions:
              - field: "workshopId"
                mapping:
                  null: "deviceEfficiencyFactoryWeeklyReport"
                  default: "deviceEfficiencyWorkshopWeeklyReport"
          month:
            conditions:
              - field: "workshopId"
                mapping:
                  null: "deviceEfficiencyFactoryMonthlyReport"
                  default: "deviceEfficiencyWorkshopMonthlyReport"
    # 默认回退（当条件不匹配时）
    default: "deviceEfficiencyFactoryDailyReport"

  # ========================================
  # 设备效率报告 - 工厂级日报
  # ========================================
  deviceEfficiencyFactoryDailyReport:
    name: "设备效率工厂日报"
