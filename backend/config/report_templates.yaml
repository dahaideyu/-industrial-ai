        use_raw_data: false
        use_ragflow: false
        context_from_index: 0
        use_historical_context: true

      - template: "device_factory_daily_report03.txt"
        output_name: "改善建议"
        use_raw_data: false
        use_ragflow: true
        context_from_index: 1

  # ========================================
  # 设备效率报告 - 工厂级周报
