  # ========================================
  # 精益质量周报
  # ========================================
  leanQualityWeekReport:
    name: "精益质量周报"
    templates:
      - template: "lean_quality_weekly_report01.txt"
        output_name: "基础周报"
        use_raw_data: true
        use_ragflow: false

      - template: "lean_quality_weekly_report02.txt"
