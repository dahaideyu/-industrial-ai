# CPK=1.33 重算规格上下限：中位数过滤参数默认值
# 算法：拉原始数据 → 取中位数 → 保留 [中位数*(1-下限比例), 中位数*(1+上限比例)] 内的值 →
#       在过滤后的数据上算 μ/σ → USL = μ + cpk_target*3σ, LSL = μ - cpk_target*3σ
#
# 上下限比例可以分开单独调（不对称过滤，比如某参数偏向只在上方有离群点）。
# 前端"重算"弹窗里单次输入的值只影响当次计算，不会改这个文件；要改全局默认值改这里。
median_filter_low_pct: 0.15
median_filter_high_pct: 0.15
cpk_target: 1.33
