# ============================================================
# 临时规则配置文件
# ============================================================
#
# 用于管理报告生成中的临时业务规则，无需修改提示词模板即可
# 灵活添加、启用/禁用、过期管理临时规则。
#
# 使用说明：
#   1. 新增规则：在 rules 列表中添加新条目
#   2. 禁用规则：将 enabled 设为 false
#   3. 删除规则：直接删除对应条目
#   4. 规则过期：设置 expire_date，系统会自动跳过已过期规则
#
# 规则注入位置：提示词模板中的 {temporary_rules} 占位符处
#   - 若模板中存在该占位符，规则替换到该位置
#   - 若模板中不存在该占位符，规则自动追加到提示词末尾
# ============================================================

rules:
  # ---- 示例规则（已启用，可直接修改或禁用） ----

  - id: curing_room_efficiency
    # 规则内容（支持多行，使用 YAML | 语法）
    content: |
      **⚠️ 临时规则（仅限固化设备）**：正负固化产能充足，正负固化的设备效率暂时不纳入分析。
      在设备运转率分析、核心指标概览、结论等涉及设备效率的部分，
      **跳过正固化三、负固化一、负固化二等固化相关设备**，不分析其运转率达标情况。
      **重要：此规则仅适用于上述固化设备，对于非固化设备（如制带线等）严禁提及"临时规则"或"跳过"等说明，直接分析即可。**
      **严禁在报告中提及"临时规则"、"根据临时规则"、"按照临时规则"等任何关于规则本身的说明。这些规则是内部处理逻辑，不应出现在最终报告中。**
    enabled: true
    # 适用的报告类型（留空或不填表示适用于所有报告类型）
    report_types:
      - leanMorningDailyReport
      - factoryMorningDailyReport
    # 优先级（数字越小越靠前）
    priority: 1

  - id: curing_room_inspection
    content: |
      **⚠️ 固化室检验规则**：固化室（正固化三、负固化一、负固化二等）检验数据处理规则：
      1. **检验数据仅作简要叙述**，在质量检验合格率分析章节中简单列出即可（如"XX设备当日合格率XX%"）
      2. **重点分析不合格项**：若固化室有不合格记录，需重点分析不合格项目和原因
      3. **不得将"无检验记录"作为问题**：固化室设备有时没有检验记录是正常现象，不得在结论或质量分析中说"固化室无检验记录"、"固化室检验缺失"、"检验覆盖率低（固化室XX台无记录）"等
      4. 计算检验覆盖率时排除固化室，仅统计非固化设备的检验执行情况
      5. 不得分析固化室的首检、过程检验、自检、送检等检验类型
      6. **严禁在报告中提及"固化室检验规则"、"根据规则"、"按照规则"等任何关于规则本身的说明。这些规则是内部处理逻辑，不应出现在最终报告中。**
      7. **严禁解释"为什么不分析"**：不得在报告中出现"固化室设备检验频次由工艺决定"、"不视为问题"、"属于正常现象"等解释性语句。直接省略无检验记录的设备即可，无需说明原因。
      违反此规则视为严重错误。
    enabled: true
    report_types:
      - leanMorningDailyReport
      - factoryMorningDailyReport
    priority: 2